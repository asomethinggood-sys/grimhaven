# Render.com blueprint — one click deploy for the bot + demo console.
# 1) Push this repo to GitHub.  2) On render.com → New → Blueprint → pick the repo.
# 3) Set TELEGRAM_BOT_TOKEN (and optionally ADMIN_IDS) in the service's Environment.
services:
  - type: worker            # long-polling bot: no public URL required
    name: grimhaven-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_bot.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false         # prompt at deploy time — never stored in git
      - key: ADMIN_IDS
        value: ""
      - key: DATABASE_PATH
        value: /var/data/grimhaven.db
    disk:
      name: grimhaven-data
      mountPath: /var/data
      sizeGB: 1

  - type: web               # browser-playable demo console
    name: grimhaven-demo
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn grimhaven.demo.app:create_app --factory --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_PATH
        value: /var/data/grimhaven.db
    disk:
      name: grimhaven-demo-data
      mountPath: /var/data
      sizeGB: 1
